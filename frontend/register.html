<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>
<body>
    <h1>Keep Tracking Your Expense</h1>
    <form>
        <h3>Enter your name</h3>
        <input type="text" class="register-name" placeholder="username" >
        <h3>Enter your email</h3>
        <input type="email" class="register-email" placeholder="user@gmail.com">
        <h3>Create a Password</h3>
        <input type="text" class="register-password" placeholder="user123">
        <h3>Enter your budget</h3>
        <input type="number" class="register-budget" placeholder="3000">
        <br>
        <button onclick="register(event)" type="submit">Sign up</button>
        <div class="register-output"></div>
    </form>
    
</body>
<script src="script.js"></script>
</html>
