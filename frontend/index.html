<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Account</title>
</head>
<body>
    <h1>Login Here</h1>
    <form>
        <h3>Enter your email</h3>
        <input class="login-email" type="email" placeholder="username@gmail.com">
        <h3>Enter password</h3>
        <input id="login-password" type="text" placeholder="user123"><br>
        <button onclick="login(event)">Sign in</button>
        <h2>New User | <a href="register.html">Register here</a></h2>
        <div class="login-output"></div>
        
    </form>
</body>
<script src="script.js"></script>
</html>
